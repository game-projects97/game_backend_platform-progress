name: Dashboard Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 게시 데이터와 자산 확인
        run: python3 scripts/verify-dashboard.py
      - name: 기존 사이트 구성 보존
        run: |
          mkdir _site
          cp -a index.html styles.css report-data.json .nojekyll api plan-v2 board _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
      - name: 배포한 revision 기록
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          manifest = json.load(open('board/publication.json'))
          print(f"대시보드 원본 revision: {manifest['revision']}")
          print(f"게시 데이터 SHA-256: {manifest['stateSha256']}")
          PY
