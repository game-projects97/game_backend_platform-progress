name: Dashboard Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ format('{0}board/', steps.deployment.outputs.page_url) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 게시 데이터와 자산 확인
        run: node scripts/verify-dashboard.mjs
      - name: 작업 대시보드만 공개
        run: |
          mkdir _site
          cp -a .nojekyll board _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        id: pages_upload
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Pages 산출물 조회 대기
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            if gh api --silent "repos/$GITHUB_REPOSITORY/actions/artifacts/$PAGES_ARTIFACT_ID"; then
              # 배포 액션의 산출물 목록에도 업로드가 반영될 시간을 준다.
              sleep 5
              exit 0
            fi
            sleep 5
          done
          echo "업로드한 Pages 산출물을 조회하지 못했습니다." >&2
          exit 1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: 배포한 revision 기록
        run: |
          node scripts/verify-dashboard.mjs --summary
