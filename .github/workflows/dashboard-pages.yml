name: Dashboard Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 게시 데이터와 자산 확인
        run: node scripts/verify-dashboard.mjs
      - name: 기존 사이트 구성 보존
        run: |
          mkdir _site
          cp -a index.html styles.css report-data.json .nojekyll api plan-v2 board _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        id: pages_upload
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Pages 산출물 조회 대기
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            if gh api --silent "$GITHUB_REPOSITORY/actions/artifacts/$PAGES_ARTIFACT_ID"; then
              # 배포 액션의 산출물 목록에도 업로드가 반영될 시간을 준다.
              sleep 5
              exit 0
            fi
            sleep 5
          done
          echo "업로드한 Pages 산출물을 조회하지 못했습니다." >&2
          exit 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: 배포한 revision 기록
        run: |
          node scripts/verify-dashboard.mjs --summary
